 fill="#444441">Legacy</text><text x="382.0" y="195" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5F5E5A">to come</text><rect x="20" y="242" width="420" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="230.0" y="262" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#3C3489">Level 1 · Tribe</text><text x="230.0" y="281" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#534AB7">The community, gatherings, exchange</text><rect x="20" y="312" width="420" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="230.0" y="332" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#3C3489">Level 0 · Initiations</text><text x="230.0" y="351" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#534AB7">Free: e-book, stories, info sessions</text><rect x="20" y="388" width="205" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5 4"/><text x="122.5" y="408" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#444441">Benevolent Executive</text><text x="122.5" y="427" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5F5E5A">Separate, not a level</text><rect x="235" y="388" width="205" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="337.5" y="408" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#444441">One free month</text><text x="337.5" y="427" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5F5E5A">Any paid level, 1 to 3</text><text x="20" y="472" font-size="13" fill="#5F5E5A">Each level includes everything below it.</text><text x="20" y="492" font-size="13" fill="#5F5E5A">The pathway: climbing from Level 0 to Level 3.</text></svg>