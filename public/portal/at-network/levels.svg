<svg xmlns="http://www.w3.org/2000/svg" width="460" height="580" viewBox="0 0 460 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="AT Network tiers"><rect width="460" height="580" rx="14" fill="#ffffff"/><rect x="20" y="20" width="420" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="230.0" y="40" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#3C3489">Tier 4 · Benevolent Executive</text><text x="230.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#534AB7">Mentor7 Clan + one-on-ones, in-person weekends</text><rect x="20" y="90" width="420" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="230.0" y="110" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#3C3489">Tier 3 · Mentor7 Clan</text><text x="230.0" y="129" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#534AB7">Academy + a small Clan, fortnightly</text><rect x="20" y="160" width="420" height="140" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="2"/><text x="230.0" y="180" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#712B13">Tier 2 · Academy · the main door</text><text x="230.0" y="199" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#993C1D">Tribe + courses, live calls, Q&amp;A, breakouts</text><rect x="36" y="226" width="150" height="58" rx="10" fill="#ffffff" stroke="#993C1D" stroke-width="2"/><text x="111.0" y="246" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#712B13">Foundations</text><text x="111.0" y="265" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#993C1D">First course, open now</text><rect x="198" y="226" width="108" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="252.0" y="