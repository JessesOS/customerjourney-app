eight="600" fill="#444441">Apply, then a call</text><text x="337.5" y="497" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#5F5E5A">Mentor7 Clan and Executive</text><text x="20" y="544" font-size="13" fill="#5F5E5A">Each tier includes the ones below it.</text></svg>